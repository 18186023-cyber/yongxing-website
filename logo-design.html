<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y&L 商标设计 - 潮州市潮安区江东西前溪永兴服装厂</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 40px 20px;
        }
        .container { text-align: center; max-width: 1200px; }
        
        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 42px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .subtitle {
            color: #fff;
            opacity: 0.8;
            margin-bottom: 50px;
            font-size: 18px;
        }
        
        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
            margin-bottom: 50px;
        }
        
        .logo-box { text-align: center; }
        
        /* 样式1: 经典黑底金字 */
        .logo1 {
            background: #000;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo1 .yl {
            font-size: 85px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 5px;
        }
        .logo1 .yl span {
            color: #FFD700;
        }
        
        /* 样式2: 金色奢华 */
        .logo2 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            width: 280px;
            height: 280px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(255,215,0,0.4);
        }
        .logo2 .yl {
            font-size: 85px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        /* 样式3: 蓝色商务 */
        .logo3 {
            background: linear-gradient(135deg, #1a5f7a 0%, #159895 100%);
            width: 280px;
            height: 280px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(26,95,122,0.4);
            position: relative;
            overflow: hidden;
        }
        .logo3::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }
        .logo3 .yl {
            font-size: 85px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 8px;
            position: relative;
            z-index: 1;
        }
        
        /* 样式4: 极简白底蓝字 */
        .logo4 {
            background: #fff;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 4px solid #1a5f7a;
        }
        .logo4 .yl {
            font-size: 85px;
            font-weight: bold;
            background: linear-gradient(135deg, #1a5f7a, #159895);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
        }
        
        /* 样式5: 阿拉伯风格六边形 */
        .logo5 {
            background: linear-gradient(135deg, #002B5B 0%, #1a5f7a 100%);
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(0,43,91,0.4);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        .logo5 .yl {
            font-size: 75px;
            font-weight: bold;
            color: #FFD700;
            letter-spacing: 8px;
        }
        
        /* 样式6: 印章风格 */
        .logo6 {
            background: #8B0000;
            width: 280px;
            height: 280px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(139,0,0,0.4);
            border: 8px solid #8B0000;
            position: relative;
        }
        .logo6::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 3px solid rgba(255,255,255,0.6);
            border-radius: 8px;
        }
        .logo6 .yl {
            font-size: 85px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 5px;
            opacity: 0.9;
        }
        
        .style-label {
            color: #fff;
            font-size: 16px;
            margin-top: 10px;
            opacity: 0.9;
            font-weight: 500;
        }
        
        .footer-text {
            color: #fff;
            opacity: 0.6;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Y&L 商标设计</h1>
    <p class="subtitle">潮州市潮安区江东西前溪永兴服装厂 · 专业出口中东</p>
    
    <div class="row">
        <div class="logo-box">
            <div class="logo1">
                <div class="yl">Y<span>&</span>L</div>
            </div>
            <div class="style-label">经典黑底金字</div>
        </div>
        <div class="logo-box">
            <div class="logo2">
                <div class="yl">Y&L</div>
            </div>
            <div class="style-label">金色奢华风格</div>
        </div>
        <div class="logo-box">
            <div class="logo5">
                <div class="yl">Y&L</div>
            </div>
            <div class="style-label">阿拉伯六边形</div>
        </div>
    </div>
    
    <div class="row">
        <div class="logo-box">
            <div class="logo3">
                <div class="yl">Y&L</div>
            </div>
            <div class="style-label">蓝色商务风格</div>
        </div>
        <div class="logo-box">
            <div class="logo4">
                <div class="yl">Y&L</div>
            </div>
            <div class="style-label">极简白底蓝字</div>
        </div>
        <div class="logo-box">
            <div class="logo6">
                <div class="yl">Y&L</div>
            </div>
            <div class="style-label">印章传统风格</div>
        </div>
    </div>
    
    <p class="footer-text">选择您喜欢的风格，我可以导出高清图片用于网站和印刷</p>
</div>
</body>
</html>
